<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#04101c">
    <title>Session logged</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="card center">
        <div class="wave-badge">{{ '✅' if already_rated else '🤙' }}</div>
        <h1>{{ 'Already logged' if already_rated else 'Logged' }}</h1>
        <p class="subtitle">{{ break_name }}</p>

        <div class="stars-display" aria-label="{{ rating }} out of 5 stars">
            {% for i in range(1, 6) %}<span class="{{ 'filled' if i <= rating else '' }}">★</span>{% endfor %}
        </div>

        {% if notes %}
            <p class="notes-display">&ldquo;{{ notes }}&rdquo;</p>
        {% endif %}
    </main>
</body>
</html>
